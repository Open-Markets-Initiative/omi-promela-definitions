name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Spin
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends spin

    - name: Spin Version
      run: spin -V

    - name: Check Every Definition
      run: sh ./check.sh
